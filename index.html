<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한지방행정공제회 · AI 심화 실습 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* === POBA 브랜드 팔레트 === */
    --poba-navy: #003087;
    --poba-navy-dark: #00205F;
    --poba-navy-tint: rgba(0, 48, 135, 0.06);
    --poba-navy-soft: rgba(0, 48, 135, 0.12);
    --poba-sky: #0077C8;
    --poba-sky-tint: rgba(0, 119, 200, 0.08);
    --poba-sky-soft: rgba(0, 119, 200, 0.16);

    --brand-primary: var(--poba-navy);
    --brand-primary-dark: var(--poba-navy-dark);
    --brand-primary-light: var(--poba-navy-tint);
    --brand-accent: var(--poba-sky);
    --brand-accent-light: var(--poba-sky-tint);
    --brand-gradient: linear-gradient(135deg, var(--poba-navy) 0%, var(--poba-sky) 100%);
    --brand-gradient-strong: linear-gradient(135deg, var(--poba-navy-dark) 0%, var(--poba-navy) 100%);

    --sidebar-bg: #0A1A3A;
    --sidebar-text: rgba(255,255,255,0.6);
    --sidebar-text-active: #FFFFFF;
    --sidebar-section: rgba(255,255,255,0.3);
    --sidebar-border: rgba(255,255,255,0.06);
    --bg: #F7F7F8;
    --card-bg: #FFFFFF;
    --card-soft: #FAFAFB;
    --text-primary: #0A1A3A;
    --text-secondary: #5A6170;
    --text-muted: #8B92A0;
    --border: #E8E9ED;
    --border-strong: #D4D6DC;
    --neutral-bg: #F4F4F5;
    --success: var(--poba-sky);
    --success-bg: #E8F3FC;
    --warning: var(--poba-sky);
    --warning-bg: #E8F3FC;
    --danger: var(--poba-navy-dark);
    --danger-bg: #EEF2FA;

    --radius: 12px;
    --radius-lg: 16px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(0,48,135,0.06);
    --shadow-md: 0 4px 14px rgba(0,48,135,0.10);
    --shadow-lg: 0 10px 28px rgba(0,48,135,0.14);
    --shadow-xl: 0 20px 48px rgba(0,48,135,0.18);
    --sidebar-width: 280px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  h1, h2, h3, h4, h5, p, li, span, div, .card p, .callout, .scenario-box { word-break: keep-all; }
  .mono, code { word-break: break-all; }
  .pb-content { word-break: keep-all; overflow-wrap: anywhere; }
  code, .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ========== APP LAYOUT ========== */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-top {
    padding: 24px 22px 18px;
    border-bottom: 1px solid var(--sidebar-border);
  }
  .sb-brand { display: flex; align-items: center; gap: 12px; }
  .sb-mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--brand-gradient);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #fff;
    box-shadow: 0 2px 12px rgba(0,48,135,0.35);
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }
  .sb-title { font-weight: 700; font-size: 14px; line-height: 1.3; color: #fff; }
  .sb-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; letter-spacing: 0.5px; }

  .sidebar-nav { padding: 14px 12px; flex: 1; }
  .nav-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--sidebar-section); font-weight: 600;
    padding: 14px 12px 8px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    color: var(--sidebar-text); font-size: 13px; font-weight: 500;
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
    margin-bottom: 2px; user-select: none; border: none; width: 100%;
    text-align: left; background: transparent;
  }
  .nav-item:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.05); }
  .nav-item.active {
    background: var(--brand-gradient); color: #fff; font-weight: 600;
    box-shadow: 0 2px 12px rgba(0,48,135,0.3);
  }
  .nav-num {
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; flex-shrink: 0;
  }
  .nav-item.active .nav-num { background: rgba(255,255,255,0.25); color: #fff; }

  .sidebar-foot {
    padding: 16px 22px; border-top: 1px solid var(--sidebar-border);
    font-size: 10px; color: rgba(255,255,255,0.3);
    text-align: center; letter-spacing: 0.5px;
  }

  .main-area {
    flex: 1; margin-left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .main-head { padding: 36px 56px 0; width: 100%; }
  .main-head .crumb {
    font-size: 11px; color: var(--text-muted); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 8px; font-weight: 600;
  }
  .main-head h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.6px;
    margin-bottom: 10px; word-break: keep-all; color: var(--text-primary);
  }
  .main-head .lead { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
  .panels { padding: 28px 56px 80px; width: 100%; flex: 1; }
  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ===== Components ===== */
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--poba-navy);
    margin: 28px 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 22px 20px;
    box-shadow: var(--shadow-sm); transition: all 0.25s;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .card-soft { background: var(--card-soft); }
  .card h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; }
  .card p { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
  .card .icn { font-size: 22px; margin-bottom: 12px; display: inline-block; }

  .hero-banner {
    background: #fff; color: var(--text-primary); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 24px;
    position: relative; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .hero-banner .tag {
    display: inline-block; padding: 6px 14px;
    background: var(--brand-gradient); color: #fff; border-radius: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,48,135,0.2);
  }
  .hero-banner h2 { font-size: 26px; font-weight: 800; line-height: 1.25; margin-bottom: 10px; letter-spacing: -0.5px; }
  .hero-banner p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { padding: 18px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); text-align: center; }
  .stat .v { font-size: 26px; font-weight: 800; color: var(--poba-navy); letter-spacing: -0.5px; }
  .stat .l { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.3px; }

  .callout {
    background: var(--poba-navy-tint); border: 1px solid var(--poba-navy-soft);
    border-left: 3px solid var(--poba-navy); border-radius: 8px;
    padding: 14px 18px; margin: 14px 0; font-size: 13.5px;
    color: var(--text-secondary); line-height: 1.7;
  }
  .callout strong { color: var(--text-primary); }
  .callout.success { background: var(--success-bg); border-color: rgba(0,119,200,0.2); border-left-color: var(--poba-sky); }
  .callout.warn { background: var(--warning-bg); border-color: rgba(0,119,200,0.2); border-left-color: var(--poba-sky); }

  .practice {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 26px 28px; margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
  }
  .practice-head {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .practice-num {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px;
    background: var(--brand-gradient); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px;
    box-shadow: 0 4px 14px rgba(0,48,135,0.25);
  }
  .practice-meta { flex: 1; }
  .practice-tag {
    display: inline-block; padding: 4px 10px;
    background: var(--poba-navy); color: #fff; border-radius: 5px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .practice h3 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
  .practice .practice-sub { font-size: 13px; color: var(--text-secondary); }
  .practice-time { flex-shrink: 0; text-align: right; }
  .practice-time .t { font-size: 22px; font-weight: 800; color: var(--brand-primary); letter-spacing: -0.5px; }
  .practice-time .l { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

  .practice-body { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 880px) { .practice-body { grid-template-columns: 1fr; } }

  .practice-section h4 {
    font-size: 11.5px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }

  .scenario-box {
    background: var(--card-soft); border: 1px solid var(--border);
    border-left: 3px solid var(--poba-navy); padding: 14px 18px; border-radius: 6px;
    font-size: 13.5px; color: var(--text-secondary); line-height: 1.75;
  }
  .scenario-box strong { color: var(--text-primary); }
  .scenario-box ul { padding-left: 18px; margin-top: 6px; }
  .scenario-box li { margin-bottom: 4px; }

  /* prompt block */
  .prompt-block {
    position: relative; background: #0A1A3A; color: #E8E9ED;
    border-radius: 10px; padding: 16px 18px 14px; margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7;
    overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
  }
  .prompt-block .pb-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; padding-bottom: 10px;
    border-bottom: 1px dashed rgba(255,255,255,0.12);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .prompt-block .pb-name {
    font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 6px;
  }
  .prompt-block .pb-name::before {
    content: ''; width: 6px; height: 6px; background: var(--poba-sky);
    border-radius: 50%; box-shadow: 0 0 6px rgba(0,119,200,0.5);
  }
  .copy-btn {
    padding: 5px 12px; background: var(--poba-navy); color: #fff; border-radius: 6px;
    font-size: 11px; font-weight: 700; transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
    display: inline-flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(0,48,135,0.25);
  }
  .copy-btn:hover { background: var(--poba-navy-dark); transform: translateY(-1px); }
  .copy-btn.copied { background: var(--poba-sky); }
  .pb-content { white-space: pre-wrap; word-break: keep-all; max-height: none; }
  .pb-content .hi { color: var(--poba-sky); font-weight: 600; }
  .pb-content .kw { color: var(--poba-sky); }
  .pb-content .cm { color: rgba(255,255,255,0.4); font-style: italic; }

  /* table */
  .table-wrap { overflow-x: auto; margin: 14px 0; border-radius: var(--radius); border: 1px solid var(--border); }
  .kt { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  .kt thead { background: #F4F4F5; }
  .kt th { padding: 12px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); text-align: left; border-bottom: 1px solid var(--border); }
  .kt td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-secondary); vertical-align: top; }
  .kt tr:last-child td { border-bottom: none; }
  .kt td.hi { color: var(--poba-navy); font-weight: 600; }

  /* step row */
  .step-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .step { padding: 10px 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text-secondary); }
  .step.hi { background: var(--brand-gradient); color: #fff; border-color: transparent; font-weight: 700; }
  .arrow { color: var(--text-muted); font-size: 16px; }

  /* team viz */
  .team-viz { background: var(--card-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 14px 0; }
  .team-lead { text-align: center; padding: 12px 20px; background: var(--brand-gradient); color: #fff; border-radius: 8px; font-weight: 700; font-size: 13px; margin-bottom: 12px; }
  .team-arrows { text-align: center; color: var(--text-muted); font-size: 20px; margin-bottom: 8px; }
  .team-arrows::before { content: '↓ ↓ ↓'; letter-spacing: 12px; }
  .team-members { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .team-member { padding: 10px 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--text-primary); box-shadow: var(--shadow-sm); }
  .team-member small { display: block; font-size: 10.5px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

  /* output card */
  .output-card { padding: 20px 22px; background: var(--card-soft); border: 1px solid var(--border); border-left: 3px solid var(--poba-sky); border-radius: var(--radius); margin: 14px 0; }
  .output-card h4 { font-size: 13px; color: var(--text-primary); margin-bottom: 12px; font-weight: 700; }
  .output-card ul { list-style: none; padding: 0; }
  .output-card li { padding: 6px 0; font-size: 13px; color: var(--text-secondary); display: flex; align-items: flex-start; gap: 8px; }
  .output-card li::before { content: '◆'; color: var(--brand-accent); flex-shrink: 0; font-size: 10px; margin-top: 6px; }

  /* check list */
  .check-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
  .check-item { padding: 14px 18px; background: #fff; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: flex-start; gap: 12px; }
  .check-item::before { content: '○'; color: var(--poba-navy); font-size: 16px; flex-shrink: 0; margin-top: -1px; }

  /* tablet / mobile */
  @media (max-width: 1180px) { .main-head { padding: 32px 36px 0; } .panels { padding: 24px 36px 80px; } }
  @media (max-width: 820px) {
    .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
    .sidebar.open { transform: translateX(0); }
    .main-area { margin-left: 0; width: 100%; }
    .main-head { padding: 72px 20px 0; }
    .panels { padding: 20px; }
    .practice { padding: 22px 18px; }
    .hero-banner { padding: 26px 22px; }
    .hero-banner h2 { font-size: 22px; }
  }
  .ham {
    display: none; position: fixed; top: 16px; left: 16px;
    width: 44px; height: 44px; background: var(--brand-primary); color: #fff;
    border-radius: 10px; z-index: 200; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: var(--shadow-md);
  }
  @media (max-width: 820px) { .ham { display: flex; } .main-head { padding-top: 72px; } }

  /* font controller */
  .font-size-controller {
    position: fixed; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 999px;
    padding: 8px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06);
    z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .font-size-controller .fs-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: #f4f4f6; color: #111;
    font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s; line-height: 1;
  }
  .font-size-controller .fs-btn:hover { background: var(--poba-navy); color: #fff; }
  .font-size-controller .fs-btn:active { transform: scale(0.92); }
  .font-size-controller .fs-btn:disabled { opacity: 0.35; cursor: not-allowed; background: #f4f4f6; color: #111; }
  .font-size-controller .fs-label { font-size: 12px; font-weight: 600; color: #555; min-width: 42px; text-align: center; user-select: none; }
  .font-size-controller .fs-reset { margin-left: 2px; background: transparent; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .font-size-controller .fs-reset:hover { color: var(--poba-navy); background: #fafafa; }
  @media (max-width: 600px) { .font-size-controller { right: 12px; bottom: 12px; padding: 6px 10px; gap: 6px; } .font-size-controller .fs-btn { width: 32px; height: 32px; font-size: 16px; } }

  /* ===== POBA additions ===== */
  .file-card { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 18px; background:#fff; border:1px solid var(--border); border-left:3px solid var(--poba-sky); border-radius:10px; margin:10px 0; }
  .file-card .fname { font-weight:700; font-size:13.5px; color:var(--text-primary); }
  .file-card .fdesc { font-size:12.5px; color:var(--text-secondary); flex-basis:100%; }
  .file-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:var(--poba-navy); color:#fff; border-radius:8px; font-size:12.5px; font-weight:700; transition:all .2s; }
  .file-btn:hover { background:var(--poba-navy-dark); transform:translateY(-1px); }
  .file-btn.pending { background:#8B92A0; }
  .sub-step { display:flex; gap:10px; align-items:center; margin:18px 0 8px; font-size:13.5px; font-weight:800; color:var(--text-primary); }
  .sub-step .sn { width:24px; height:24px; border-radius:7px; background:var(--brand-gradient); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; flex-shrink:0; }
  .sub-step small { font-weight:500; color:var(--text-muted); font-size:12px; }
  .practice-body.single { grid-template-columns: 1fr; }
  .module-badge { display:inline-block; padding:3px 9px; border-radius:5px; background:var(--poba-navy-soft); color:var(--poba-navy); font-size:10.5px; font-weight:800; letter-spacing:.5px; margin-left:8px; }
  .placeholder { border:2px dashed var(--border-strong); border-radius:var(--radius-lg); padding:44px 28px; text-align:center; background:#fff; }
  .placeholder h3 { font-size:18px; font-weight:800; margin-bottom:8px; }
  .placeholder p { font-size:13.5px; color:var(--text-secondary); }
  .link-card { display:flex; align-items:center; gap:14px; padding:16px 20px; background:#fff; border:1px solid var(--border); border-radius:10px; margin:10px 0; text-decoration:none; color:inherit; transition:all .2s; }
  .link-card:hover { border-color:var(--poba-navy); box-shadow:var(--shadow-md); }
  .link-card .lt { font-weight:700; font-size:13.5px; color:var(--text-primary); }
  .link-card .ld { font-size:12px; color:var(--text-muted); }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#0A1A3A; color:#fff; padding:12px 20px; border-radius:10px; font-size:13px; z-index:10000; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:opacity .25s; }
  .toast.show { opacity:1; }
  .sb-brand { flex-direction:column; align-items:stretch; gap:14px; }
  .sb-logo { background:#fff; border-radius:12px; padding:8px 14px; box-shadow:0 2px 12px rgba(0,0,0,.25); }
  .sb-logo img { display:block; width:100%; height:auto; }
  .kt code, .scenario-box code, .callout code { background:var(--poba-navy-tint); color:var(--poba-navy); padding:1px 6px; border-radius:4px; font-size:12px; }

  /* ── 기획 시트 (Agent · Skill) ── */
  .sheet-jump { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px; }
  .sheet-jump a { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:10px; background:var(--poba-navy-tint); color:var(--poba-navy); font-size:13px; font-weight:700; text-decoration:none; border:1px solid var(--poba-navy-soft); }
  .sheet-jump a:hover { background:var(--poba-navy-soft); }
  .plan-sheet { scroll-margin-top:20px; }
  .plan-sheet + .plan-sheet { margin-top:28px; }
  .plan-sheet .sheet-badge { display:inline-block; padding:4px 10px; border-radius:6px; background:var(--brand-gradient); color:#fff; font-size:11.5px; font-weight:800; letter-spacing:.02em; }
  .plan-sheet .sheet-title { font-size:20px; font-weight:800; color:var(--text-primary); margin:10px 0 4px; }
  .plan-sheet .sheet-desc { font-size:13.5px; color:var(--text-secondary); margin-bottom:6px; }
  .plan-examples { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .plan-btn { padding:9px 15px; border-radius:8px; border:1px solid var(--border-strong); background:var(--card-bg); color:var(--poba-navy); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
  .plan-btn:hover:not(:disabled) { border-color:var(--poba-navy); background:var(--poba-navy-tint); }
  .plan-btn:disabled { opacity:.4; cursor:default; }
  .plan-btn.primary { background:var(--poba-navy); color:#fff; border-color:var(--poba-navy); }
  .plan-btn.primary:hover { background:var(--poba-navy-dark); }
  .plan-btn.ghost { background:transparent; color:var(--text-secondary); }
  .plan-status { min-height:18px; margin-top:8px; font-size:12.5px; color:var(--poba-sky); font-weight:600; }
  .plan-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 0; }
  .plan-tabs button { padding:8px 13px; border-radius:8px; border:1px solid var(--border); background:var(--card-soft); color:var(--text-secondary); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .plan-tabs button:hover { color:var(--poba-navy); border-color:var(--poba-navy-soft); }
  .plan-tabs button.done { color:var(--poba-navy); background:var(--poba-navy-tint); }
  .plan-tabs button[aria-current] { background:var(--poba-navy); border-color:var(--poba-navy); color:#fff; }
  .plan-form fieldset { border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px 20px; margin:12px 0 14px; background:var(--card-bg); }
  .plan-form legend { padding:0 8px; font-size:15px; font-weight:800; color:var(--poba-navy); }
  .plan-form .lg-hint { font-size:12.5px; color:var(--text-muted); margin:2px 0 4px; }
  .plan-form label { display:block; font-size:13.5px; font-weight:700; color:var(--text-primary); margin:14px 0 6px; }
  .plan-form label small { font-weight:500; color:var(--text-muted); margin-left:6px; }
  .plan-form textarea { display:block; width:100%; box-sizing:border-box; padding:11px 13px; border:1px solid var(--border-strong); border-radius:8px; font:inherit; font-size:13.5px; line-height:1.6; resize:vertical; color:var(--text-primary); background:var(--card-soft); }
  .plan-form textarea:focus { outline:none; border-color:var(--poba-sky); background:#fff; box-shadow:0 0 0 3px var(--poba-sky-tint); }
  .plan-form textarea::placeholder { color:#A9AFBB; }
  .plan-nav { display:flex; gap:8px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .plan-nav .grp { display:flex; gap:8px; flex-wrap:wrap; }
  .plan-progress { font-size:12.5px; color:var(--text-muted); font-weight:600; }
</style>
</head>
