ctice 폴더의 파일들을 읽고 각 파일의 열 구성과 데이터 상태를 요약해줘.\n형식이 다르거나 문제가 있어 보이는 부분을 파일별로 목록으로 정리해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>보고 받기 <small>AI 보고가 아래 항목을 잡았는지 확인<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">점검 체크리스트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p4-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p4-b\">아래 내용을 확인해줘.\n\n☐  파일 5개를 모두 읽었는가\n☐  광주 파일의 열 순서 차이를 잡았는가\n☐  날짜 형식 3종을 구분했는가\n☐  합계 행·중복 행을 지적했는가<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>규칙 정의 <small>빠뜨린 규칙이 없는지 AI에게 되묻기<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">정제 규칙 제시<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p4-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p4-c\">정제 규칙을 이렇게 정할게:\n① 날짜는 YYYY-MM-DD 형식으로 통일\n② 빈 행과 &quot;합계&quot; 행은 제거 (합계는 나중에 다시 계산)\n③ 수량·단가의 &quot;개&quot;, &quot;원&quot;, 쉼표는 떼고 숫자만\n④ 상품명 앞뒤 공백 제거 / ⑤ 완전히 같은 중복 행은 1개만\n이 규칙이 빠뜨린 게 있으면 지적해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>정제·통합 실행<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">5개 파일 → master.xlsx<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p4-d')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p4-d\">방금 정한 규칙대로 5개 파일을 정제해서 하나로 합치고,\n어느 지점 데이터인지 알 수 있게 &quot;지점&quot; 열을 추가해서 master.xlsx로 저장해줘.\n완료되면 파일별 처리 행 수와 제거된 행 수를 보고해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">5<\/span><span>검증 · 표본 대조<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">원본 3행 대조<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p4-e')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p4-e\">원본 1개 파일(예: 부산)에서 아무 3행을 골라서 master.xlsx에서 같은 행을 찾아 비교\n날짜가 통일됐는지, 숫자가 깨지지 않았는지, 지점 열이 맞는지<\/div>\n<\/div><div class=\"callout success\"><strong>💡 팁:<\/strong> 3행만 봐도 패턴이 보입니다. 전수 검사 대신 표본 대조로 빠르게 신뢰도를 확인하세요.<\/div><div class=\"sub-step\"><span class=\"sn\">6<\/span><span>요약 시트<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">summary 시트 추가<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p4-f')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p4-f\">master.xlsx에 summary 시트를 추가해서 지점별 매출 합계와\n상품별 매출 합계를 각각 표로 정리해줘. 합계가 큰 순서로.<\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m1-p5\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">⑤<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M1 · Hands-on<\/span><h3>CLAUDE.md 마크다운 파일 제작<\/h3><div class=\"practice-sub\">마크다운 문법을 손으로 익히고, 프로젝트 규칙 파일을 만듭니다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 진행 단계<\/h4><div class=\"scenario-box\"><ul><li><strong>손으로 5줄 연습<\/strong> — 마크다운 문법(제목, 목록, 인용, 체크박스)을 직접 써 봅니다.<\/li><li><strong>CLAUDE.md 생성<\/strong> — 폴더 구조를 AI가 파악해 규칙 파일을 만듭니다.<\/li><li><strong>고도화<\/strong> — 지금까지의 작업을 바탕으로 규칙을 추가하되, 전체 10줄 이내로 유지합니다.<\/li><\/ul><\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>손으로 5줄 연습해보기<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">마크다운 연습 예시<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p5-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p5-a\"># 박소연\n- 직업: AI 전문 강사\n- 취미: 테니스\n\n&gt; **휴식**이 중요하다고 생각\n\n## To do\n- [ ] 논문 읽기\n- [ ] 운동 읽기\n- [ ] 강의 자료 확인하기<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>CLAUDE.md 생성<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">CLAUDE.md 만들기<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p5-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p5-b\">이 프로젝트의 CLAUDE.md를 만들어줘.\n\n포함할 것:\n① 프로젝트 한 줄 소개 (현재 폴더의 파일 구조를 보고 네가 파악해서 작성)\n② 항상 한국어로 답할 것\n③ 파일을 바꾸기 전에 계획을 먼저 보여줄 것\n④ 원본 데이터 파일(csv 등)은 수정하지 말 것<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>고도화<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">규칙 3개 제안받기<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m1p5-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m1p5-c\">@plan.md 와 지금까지 이 폴더에서 한 작업을 보고,\nCLAUDE.md에 추가하면 좋을 규칙 3개를 이유와 함께 제안해줘.\n내가 고른 것만 반영하고, 전체가 10줄을 넘지 않게 해줘.<\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m2-p1\">\n<div class=\"hero-banner\"><span class=\"tag\">Module 2<\/span><h2>AI Agent를 활용한 업무 자동화<\/h2><p>혼자 일하는 AI에서, 역할을 나눠 함께 일하는 AI 팀으로.<\/p><\/div><div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">①<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M2 · Hands-on · 적용 개념: 서브 에이전트 / 웹 검색<\/span><h3>리서치 전문 서브 에이전트 제작<\/h3><div class=\"practice-sub\">이후 실습의 표준 도구 — 한 번 만들면 계속 쓴다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>🎯 실습 목적<\/h4><div class=\"scenario-box\"><strong>\"서브 에이전트가 무엇인지 직접 만들어 본다.\"<\/strong><ul style=\"margin-top:10px;\"><li>메인 컨텍스트를 아끼면서, 단발성 리서치를 빠르게 처리하는 분신 만들기<\/li><li>이후 실습 ③·④에서 에이전트 팀의 팀원이 사용할 <strong>표준 리서치 에이전트<\/strong>로 재활용<\/li><li>\"여러 대상을 병렬로 동시 조사\" 가능한 형태로 설계<\/li><\/ul><\/div><div class=\"callout \"><strong>💡 핵심 개념:<\/strong> 서브 에이전트는 메인 세션의 분신 — 별도 컨텍스트에서 작업하고 <strong>요약 결과만 반환<\/strong>합니다. 한번 만들어두면 다음 실습부터 계속 호출할 수 있습니다.<\/div><\/div><div class=\"practice-section\"><h4>📌 진행 단계<\/h4><div class=\"scenario-box\"><ul><li>1단계 · 터미널에서 <span class=\"mono\">claude<\/span> 실행 → 새 세션 시작<\/li><li>2단계 · 아래 프롬프트를 그대로 복사해서 붙여넣기<\/li><li>3단계 · Claude Code가 서브 에이전트 정의 파일을 생성하는 과정을 관찰<\/li><li>4단계 · 테스트 질의 ①로 즉시 호출해 보기<\/li><li>5단계 · 출력 결과(핵심 요약·동향·시사점·출처)가 잘 나오는지 점검<\/li><\/ul><\/div><div class=\"callout success\"><strong>💡 핵심:<\/strong> 한 번 만든 서브 에이전트는 팀 전체 자산이 됩니다.<\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">리서치 서브 에이전트 생성<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p1-create')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p1-create\">동종 공제회·금융·정책 트렌드를 웹 검색으로 조사하는 리서치 전문 서브에이전트를 만들어줘.\n\n용도:\n- 특정 기관의 최근 동향 조사 (예: 한국교직원공제회, 군인공제회, 경찰공제회)\n- 특정 정책·트렌드 조사 (예: 공공기관 생성형 AI 도입, 공제회 자산운용 환경)\n- 여러 대상을 병렬로 동시 조사하는 시나리오에 최적화\n\n조사 결과 형식:\n1. 핵심 요약 (3~5줄)\n2. 주요 동향 3~5가지 (각각 출처 URL 포함)\n3. 대한지방행정공제회에 주는 시사점 (2~3줄)\n4. 참고 출처 리스트\n\n필수 규칙:\n- 반드시 웹 검색으로 최신 정보만 수집\n- 1년 이상 지난 자료는 명시적으로 표기\n- 출처 URL 반드시 포함\n- 추측·일반론 금지, 검색 결과 기반으로만 답변\n- 한국어로 응답<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">테스트 질의 ① · 동종 공제회 동향<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p1-test1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p1-test1\">방금 만든 리서치 서브 에이전트를 호출해서 다음을 조사해줘.\n\n대상: 한국교직원공제회\n주제: 최근 6개월 내 회원 서비스·복지사업 및 디지털 전환(AI 포함) 동향\n관심 포인트: 신규 회원 서비스·모바일/디지털 채널 변화·회원 복지 프로그램\n\n조사 결과는 표준 형식(핵심 요약 → 주요 동향 → 대한지방행정공제회 시사점 → 출처)으로 출력해.<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">테스트 질의 ② · 정책·기술 트렌드<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p1-test2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p1-test2\">리서치 서브 에이전트를 호출해서 다음 트렌드를 조사해줘.\n\n주제: 공공기관·금융권 생성형 AI 도입 동향 (최근 1년)\n관심 포인트:\n- 공공기관·금융권에서 실제로 도입한 업무 영역과 사례\n- 개인정보·보안 등 도입 시 주요 이슈와 가이드라인\n- 대한지방행정공제회가 참고할 수 있는 시사점\n\n표준 형식으로 출력.<\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m2-p2\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">②<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M2 · Hands-on · 적용 개념: 서브 에이전트 / CLAUDE.md / 파이프라인<\/span><h3>주간 업무 보고서 자동화 에이전트<\/h3><div class=\"practice-sub\">업무 메모 한 번 붙여넣기 → 2-에이전트 파이프라인이 정식 보고서를 자동 완성<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 시나리오 · 구조<\/h4><div class=\"scenario-box\"><strong>목표<\/strong><ul><li><span class=\"mono\">input/이번주_업무.txt<\/span>에 업무 내용을 붙여넣으면<\/li><li><strong>collector 에이전트<\/strong>가 4개 섹션(완료/진행/예정/이슈)으로 분류하고<\/li><li><strong>writer 에이전트<\/strong>가 정식 보고서 양식으로 자동 완성<\/li><\/ul><\/div><h4 style=\"margin-top:18px;\">🗂️ 프로젝트 폴더 구조<\/h4><div class=\"scenario-box\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;\">weekly-report/<br>&nbsp;&nbsp;input/<br>&nbsp;&nbsp;&nbsp;&nbsp;이번주_업무.txt &nbsp;&nbsp;← 실습자 직접 작성<br>&nbsp;&nbsp;output/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 자동 생성<br>&nbsp;&nbsp;agents/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 자동 생성<\/span><\/div><h4 style=\"margin-top:18px;\">👥 에이전트 구성<\/h4><div class=\"team-viz\"><div class=\"team-lead\">📄 input/이번주_업무.txt (인풋)<\/div><div class=\"team-arrows\" style=\"margin:10px 0;\"><\/div><div class=\"team-members\"><div class=\"team-member\">🗂️ collector<small>4개 섹션 분류<\/small><\/div><div style=\"display:flex;align-items:center;color:var(--text-muted);font-size:18px;\">→<\/div><div class=\"team-member\">✍️ writer<small>보고서 작성<\/small><\/div><\/div><div style=\"text-align:center;margin-top:10px;font-size:12px;color:var(--text-muted);\">↓<\/div><div class=\"team-lead\" style=\"margin-top:8px;\">📑 output/주간보고서_(날짜).docx (산출물)<\/div><\/div><div class=\"callout success\"><strong>💡 재사용 포인트:<\/strong> Step 1~3(에이전트 파일)은 한 번만 설정합니다. 이후 매주 txt 내용만 바꾸고 실행 한 줄이면 끝입니다. <strong>이게 에이전트를 만들어두는 의미입니다.<\/strong><\/div><\/div><div class=\"practice-section\"><h4>📥 실습 파일<\/h4><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"weekly-form-m2\" onclick=\"downloadFile('weekly-form-m2','주간보고_양식.docx')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 주간보고_양식.docx<\/span>\n  <span class=\"fdesc\">Word 보고서 양식입니다. 프로젝트 폴더 최상단에 저장하세요. (M3 주간보고 Skill 실습과 같은 양식)<\/span>\n<\/div><div class=\"callout \"><strong>입력 파일(샘플):<\/strong> 아래 Step 4의 1주차·2주차 샘플을 복사해서 <span class=\"mono\">input/이번주_업무.txt<\/span>로 저장하면 됩니다. (가상의 업무 내용입니다)<\/div><\/div><div class=\"practice-section\"><h4>📋 에이전트 만들기<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>CLAUDE.md 생성<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 1 · CLAUDE.md 생성<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-1\">CLAUDE.md 파일을 만들어줘.\n\n이 프로젝트는 주간 업무 보고서 자동화 에이전트 팀이야.\n\n보고서 양식:\n- 프로젝트 폴더의 주간보고_양식.docx를 기준으로 작성할 것\n\n작성 규칙:\n- 언어: 한국어\n- 문체: 명사형 종결 (습니다 체 금지)\n  예시: &quot;보고서 작성 완료&quot; (O) / &quot;보고서를 작성했습니다&quot; (X)\n- 추상적 표현 금지: &quot;열심히&quot;, &quot;최선을 다해&quot;, &quot;노력 중&quot; 사용 불가\n- 진척률: 반드시 숫자(%)로 표기\n- 긴급도: 반드시 높음 / 보통 / 낮음 중 하나로 표기\n- 항목당 1~2줄 이내\n\n결과물:\n- 저장 위치: output/주간보고서_(날짜).docx\n- 날짜: input/이번주_업무.txt의 보고 기간 시작일 기준\n  예시: 보고 기간이 2026년 11월 2일 ~ 11월 6일이면 → 주간보고서_20261102.docx\n\n서브 에이전트 구성:\n1. collector — input/이번주_업무.txt를 읽어 4개 섹션으로 분류\n2. writer — 분류 결과를 주간보고_양식.docx 양식에 맞게 word 파일로 작성<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>collector 에이전트 생성<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 2 · collector 에이전트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-2\">agents/ 폴더를 생성하여 collector 에이전트를 만들어줘.\n\n이 에이전트는 input/이번주_업무.txt를 읽어서\n아래 4개 섹션으로 분류하는 역할이야.\n\n분류 기준:\n- 완료 업무: 이번 주 안에 끝난 업무\n  → 관련 부서/대상, 완료일 추정 포함\n- 진행 중 업무: 아직 진행 중인 업무\n  → 진척률(%) 추정, 예상 완료일, 담당자 포함\n- 다음 주 예정: 다음 주에 할 업무로 언급된 것\n  → 예정일, 준비사항 포함\n- 이슈/요청사항: 문제, 지연, 도움 요청이 필요한 것\n  → 긴급도(높음/보통/낮음) 판단, 요청 대상·내용 포함\n\n분류 결과는 agents/collector_output.md에 저장해줘.\n각 항목은 표 한 행으로 채울 수 있도록 항목별로 정리할 것.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>writer 에이전트 생성<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 3 · writer 에이전트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-3')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-3\">agents/ 폴더를 생성하여 writer 에이전트를 만들어줘.\n\n이 에이전트는 agents/collector_output.md를 읽어서\nCLAUDE.md에 정의된 양식대로 주간 업무 보고서를 작성하는 역할이야.\n\n출력 형식:\n- 프로젝트 폴더의 주간보고_양식.docx 파일을 읽어서\n  해당 양식의 표 구조를 그대로 유지할 것\n- 기본 정보(보고일자·보고자·기간·직급)는 input/이번주_업무.txt에서 추출\n- 각 섹션의 행 수는 collector 분류 결과에 따라 유동적으로 작성\n- 진척률 미언급 시 &quot;확인 필요&quot;로 표기\n- 이슈 없을 경우 섹션 4 행에 &quot;해당 없음&quot; 표기\n- 서명란은 작성자 성명만 채우고 나머지는 빈칸\n\n결과물은 CLAUDE.md의 규칙에 따라 output/주간보고서_(날짜).docx로 저장해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>input 파일 작성 <small>실습자 직접 작성 · VS Code에서 input/이번주_업무.txt 생성<\/small><\/span><\/div><div class=\"callout \"><strong>📝 작업:<\/strong> 아래 샘플(가상 데이터)을 붙여넣거나, 이번 주 실제 업무를 자유롭게 입력합니다. 실습 순서: <strong>1주차 → 결과 확인 → 2주차로 교체 후 재실행<\/strong>.<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">샘플 · 이번주_업무_1주차.txt (회원서비스팀 · 11/2~11/6)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-in1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-in1\">이름: 김하늘\n소속: 회원서비스팀\n직급: 주임\n보고 기간: 2026년 11월 2일 ~ 11월 6일\n\n이번 주에 한 일:\n- 회원 대상 복지서비스 안내문 개정안 작성 완료 (수요일 팀장 검토 후 수정본 제출)\n- 회원 문의 FAQ 20건 정리, 홈페이지 게시용 문안 전달 (공개 전 법무 검토 필요)\n  → 법무담당 부서 검토 의견 확인 후 게시 예정\n- 12월 회원 만족도 설문 문항 설계 중 (초안 60% 진행)\n- 신규 회원 대상 모바일 이용 가이드 자료 수집 시작 (아직 초기 단계)\n\n다음 주 할 일:\n- 회원 만족도 설문 문항 최종안 확정 및 팀 공유 (화요일 예정)\n- 복지서비스 안내문 개정본 홈페이지 게시 (목요일 예정)\n\n이슈:\n- 홈페이지 게시 문안의 법무 검토 회신이 지연되고 있음\n  → 게시 일정 조정 필요, 법무담당 부서에 회신 요청 필요\n- 설문 시스템의 문항 수 제한으로 일부 문항 구성 변경 필요\n  → 시스템 담당 부서와 협의 필요<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">샘플 · 이번주_업무_2주차.txt (회원서비스팀 · 11/9~11/13)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-in2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-in2\">이름: 김하늘\n소속: 회원서비스팀\n직급: 주임\n보고 기간: 2026년 11월 9일 ~ 11월 13일\n\n이번 주에 한 일:\n- 회원 만족도 설문 문항 최종안 확정 및 팀 공유 완료 (화요일)\n  → 문항 수 18개에서 15개로 축소 (설문 시스템 제한 반영)\n- 복지서비스 안내문 개정본 홈페이지 게시 완료 (목요일)\n- 회원 문의 FAQ 법무 검토 회신 수령, 수정 반영 완료 (금요일)\n- 모바일 이용 가이드 목차 및 초안 작성 (진행률 40%)\n\n다음 주 할 일:\n- 모바일 이용 가이드 초안 완성 (진행률 100% 목표, 수요일 예정)\n- 설문 발송 및 응답 현황 모니터링 시작 (목요일 예정)\n\n이슈:\n- 설문 발송 대상 회원 명단 추출 일정이 확정되지 않음\n  → 정보시스템 담당 부서에 데이터 추출 요청 필요 (긴급도 높음)<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">5<\/span><span>실행 <small>새 채팅창에서 입력<\/small><\/span><\/div><div class=\"callout warn\"><strong>⚠️ 주의:<\/strong> Step 1~3 완료 후 <strong>새 채팅창<\/strong>을 열어 아래 프롬프트를 입력하세요.<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 5 · 에이전트 실행<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-5')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-5\">공제회 주간보고서 에이전트에 요청한다.\n두 에이전트를 순서대로 실행해줘.\n\ncollector → writer 순서로 실행하여 이번주 주간업무 보고서를 작성해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">6<\/span><span>재사용 방법 <small>매주 이렇게만 하면 됩니다<\/small><\/span><\/div><div class=\"callout success\"><strong>Step 1~3은 다시 실행할 필요 없습니다.<\/strong> 에이전트 파일은 이미 만들어져 있습니다. ① <span class=\"mono\">input/이번주_업무.txt<\/span> 내용을 이번 주 업무로 교체 → ② 새 채팅창에서 아래 한 줄 입력<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">매주 재사용 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p2-reuse')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p2-reuse\">input/이번주_업무.txt 내용을 교체했어.\n두 에이전트 순서대로 다시 실행해줘.<\/div>\n<\/div><div class=\"table-wrap\"><table class=\"kt\"><thead><tr><th>단계<\/th><th>행동<\/th><th>핵심 포인트<\/th><\/tr><\/thead><tbody><tr><td class=\"hi\">Step 1~3<\/td><td>에이전트 파일 생성<\/td><td>로컬에 파일이 실제로 저장됨<\/td><\/tr><tr><td>Step 4<\/td><td>txt 파일 작성<\/td><td>인풋만 바꾸면 재사용 가능<\/td><\/tr><tr><td>Step 5<\/td><td>실행 한 줄<\/td><td>에이전트가 순서대로 자동 실행<\/td><\/tr><tr><td class=\"hi\">재사용<\/td><td>txt만 교체 후 실행<\/td><td>\"이게 에이전트를 만들어두는 의미\" 체감<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m2-p3\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">③<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M2 · Hands-on · 적용 개념: 멀티 에이전트(병렬) / 서브 에이전트 / 결과 병합<\/span><h3>규정 개정 영향 검토 — 병렬 멀티 에이전트<\/h3><div class=\"practice-sub\">상위 지침 개정 → 내부 규정 4종을 4개 서브 에이전트가 동시에 검토 → 신구조문 대비표<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 시나리오 · 목표<\/h4><div class=\"scenario-box\"><strong>목표<\/strong><ul><li>(가상) 상위 지침 <strong>「공공기관 개인정보 보호 및 생성형 AI 활용 지침」<\/strong>이 개정됨<\/li><li>공제회 내부 규정 <strong>4종<\/strong>(개인정보보호 · 정보보안 · 회원정보 · 위탁업무) 중 고쳐야 할 조항을 찾기<\/li><li>결과를 공공기관 표준 양식인 <strong>신구조문 대비표<\/strong>로 정리<\/li><\/ul><\/div><h4 style=\"margin-top:18px;\">🗂️ 프로젝트 폴더 구조<\/h4><div class=\"scenario-box\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;\">reg-review/<br>&nbsp;&nbsp;input/<br>&nbsp;&nbsp;&nbsp;&nbsp;개정지침_2026.md &nbsp;&nbsp;← 다운로드 자료<br>&nbsp;&nbsp;&nbsp;&nbsp;규정/ (01~04 규정 4종) ← 다운로드 자료<br>&nbsp;&nbsp;output/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 자동 생성<\/span><\/div><h4 style=\"margin-top:18px;\">👥 에이전트 구성<\/h4><div class=\"team-viz\"><div class=\"team-lead\">🧭 총괄 에이전트 (메인) — 규정별로 작업을 나눠 동시에 지시<\/div><div class=\"team-arrows\"><\/div><div class=\"team-members\"><div class=\"team-member\">서브 01<small>개인정보보호 규정<\/small><\/div><div class=\"team-member\">서브 02<small>정보보안 업무지침<\/small><\/div><div class=\"team-member\">서브 03<small>회원정보 관리 세칙<\/small><\/div><div class=\"team-member\">서브 04<small>위탁업무 관리 지침<\/small><\/div><\/div><div style=\"text-align:center;margin-top:10px;font-size:12px;color:var(--text-muted);\">↓ 4개 동시 실행(병렬) · 서브 에이전트끼리는 대화하지 않음<\/div><div class=\"team-lead\" style=\"margin-top:8px;\">📑 총괄이 병합 → output/신구조문_대비표.xlsx<\/div><\/div><div class=\"callout \"><strong>💡 적용 개념:<\/strong> 멀티 에이전트(병렬) · 작업 분할 → 동시 실행 → 결과 병합. 실습 ②의 순차 파이프라인(collector → writer)과 비교해 보세요.<\/div><div class=\"callout warn\"><strong>⚠️ 가상 자료:<\/strong> 지침·규정은 모두 교육용 가상 자료입니다. 실제 업무에 적용할 때는 반드시 원문 규정과 담당 부서 검토를 거치세요.<\/div><\/div><div class=\"practice-section\"><h4>📥 실습 파일<\/h4><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"m2p3-zip\" onclick=\"downloadFile('m2p3-zip','실습3_규정개정영향검토_자료.zip')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 실습3_규정개정영향검토_자료.zip<\/span>\n  <span class=\"fdesc\">압축을 풀면 <span class=\"mono\">reg-review/<\/span> 폴더가 생깁니다. VS Code에서 이 폴더를 연 뒤 터미널에서 <span class=\"mono\">claude<\/span>를 실행하세요.<\/span>\n<\/div><div class=\"callout \"><strong>포함 파일:<\/strong> <span class=\"mono\">input/개정지침_2026.md<\/span> (변경 8개 항목) · <span class=\"mono\">input/규정/01~04_*.md<\/span> (내부 규정 4종)<\/div><\/div><div class=\"practice-section\"><h4>📋 에이전트 만들기<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>CLAUDE.md 생성 <small>검토 규칙과 결과물 형식 정의<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 1 · CLAUDE.md 생성<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-1\">CLAUDE.md 파일을 만들어줘.\n\n이 프로젝트는 상위 지침 개정에 따른 내부 규정 영향 검토 작업이야.\n\n# 입력\n- input/개정지침_2026.md : 개정된 상위 지침 (가상)\n- input/규정/ : 공제회 내부 규정 4종 (가상)\n\n# 검토 규칙\n- 언어: 한국어, 문체: 명사형 종결\n- 조항 번호(제○조 ○항)를 반드시 명시\n- 개정 근거는 개정지침의 번호(1~8)로 표기\n- 개정이 필요 없는 조항은 &quot;개정 불필요&quot;로 명확히 구분\n- 지침에 직접 언급되지 않아도 위험이 있는 조항은 &quot;검토 권고&quot;로 별도 표기\n- 우선순위: 높음(법적 기한·의무 위반 소지) / 보통 / 낮음\n\n# 결과물\n- output/신구조문_대비표.xlsx\n  열 구성: 규정명 | 조항 | 현행 | 개정안 | 근거(지침 번호) | 우선순위<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>서브 에이전트 생성 <small>규정 1개를 검토하는 reg-reviewer<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 2 · reg-reviewer 서브 에이전트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-2\">규정 1개를 개정지침과 대조하는 서브 에이전트 reg-reviewer를 만들어줘.\n\n역할:\n- 지정받은 규정 파일 1개와 input/개정지침_2026.md를 비교\n- 개정이 필요한 조항을 찾아 현행 → 개정안 형태로 정리\n- 결과는 output/검토_(규정번호).md 에 저장\n\n규칙:\n- CLAUDE.md의 검토 규칙을 따를 것\n- 자기에게 배정된 규정 1개만 검토 (다른 규정은 읽지 말 것)\n- 규정에 없는 조항을 지어내지 말 것<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>병렬 실행 <small>⏱ 스톱워치를 켜고 시작<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 3 · 4개 서브 에이전트 동시 실행 + 병합<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-3')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-3\">reg-reviewer 서브 에이전트 4개를 동시에(병렬로) 실행해줘.\n\n- 서브 01 → input/규정/01_개인정보보호_규정.md\n- 서브 02 → input/규정/02_정보보안_업무지침.md\n- 서브 03 → input/규정/03_회원정보_관리_세칙.md\n- 서브 04 → input/규정/04_위탁업무_관리_지침.md\n\n4개가 모두 끝나면 너(총괄)가 결과를 병합해줘.\n- 여러 규정에 중복되는 개정 사항은 묶어서 표시\n- 우선순위 &quot;높음&quot; 항목을 표 상단에 배치\n- 최종 결과를 output/신구조문_대비표.xlsx 로 저장<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>(비교 체험) 순차 실행 <small>/clear 후 실행 · 시간 측정<\/small><\/span><\/div><div class=\"callout \"><strong>📝 작업:<\/strong> <span class=\"mono\">/clear<\/span>로 대화를 초기화한 뒤 아래 프롬프트를 실행하고, Step 3과 걸린 시간·결과 품질을 비교합니다.<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 4 · 순차 실행 (서브 에이전트 없이)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-4')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-4\">input/규정/ 폴더의 규정 4개를 하나씩 순서대로 개정지침과 대조해서\n개정이 필요한 조항을 정리해줘. 서브 에이전트는 쓰지 마.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">5<\/span><span>결과 점검 <small>숨은 위험 조항까지 찾았는지 확인<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 5 · 결과 점검<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-5')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-5\">신구조문 대비표를 다시 점검해줘.\n1. &quot;개정 불필요&quot;로 판단한 조항과 그 이유를 목록으로 보여줘\n2. 지침에 직접 언급되진 않았지만 위험이 있는 &quot;검토 권고&quot; 조항이 있는지 확인해줘\n3. 01번과 03번 규정에 똑같이 걸리는 개정 사항이 있다면 어떻게 정비하는 게 좋은지 제안해줘<\/div>\n<\/div><div class=\"callout success\"><strong>🔍 힌트:<\/strong> 지침에 직접 언급되지 않았지만 생성형 AI와 관련해 위험한 조항이 <strong>한 곳<\/strong> 숨어 있습니다. 찾았나요?<\/div><h4 style=\"margin-top:18px;\">💬 응용 질의<\/h4><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">신설 조항 초안 작성 (생성형 AI 조항)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p3-q1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p3-q1\">개정지침_2026.md 의 &quot;생성형 AI 사용(신설)&quot; 항목만 기준으로\nreg-reviewer 4개를 병렬 실행해서, 규정별로 신설해야 할 조항 초안을 작성해줘.\n총괄은 4개 초안을 비교해 중복을 없애고, 어느 규정에 두는 게 맞는지 제안해줘.<\/div>\n<\/div><div class=\"table-wrap\"><table class=\"kt\"><thead><tr><th>구분<\/th><th>순차 실행 (Step 4)<\/th><th>병렬 실행 (Step 3)<\/th><\/tr><\/thead><tbody><tr><td class=\"hi\">걸린 시간<\/td><td>___ 분<\/td><td>___ 분<\/td><\/tr><tr><td>찾은 개정 조항 수<\/td><td>___ 개<\/td><td>___ 개<\/td><\/tr><tr><td>맥락 관리<\/td><td>한 대화에 4개 규정이 섞임<\/td><td>서브마다 규정 1개만 집중<\/td><\/tr><tr><td class=\"hi\">핵심 포인트<\/td><td colspan=\"2\">나눠서 동시에 처리 → 총괄이 병합 = <strong>멀티 에이전트(병렬)<\/strong><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m2-p4\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">④<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M2 · Hands-on · 적용 개념: 에이전트 팀 / 팀원 간 메시지 / 모델 믹싱<\/span><h3>결재 전 사전검토 위원회 — 에이전트 팀<\/h3><div class=\"practice-sub\">기획안 초안 → 4명의 팀원이 서로 반박하며 허점 찾기 → 검토의견서 · 수정안 · 예상 질의<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 시나리오 · 목표<\/h4><div class=\"scenario-box\"><strong>목표<\/strong><ul><li>담당자가 쓴 <strong>「청년 회원 모바일 웰컴 패키지」 기획안 초안<\/strong>(가상)을 결재 올리기 전에 검토<\/li><li>기획안에는 <strong>허점이 숨어 있습니다<\/strong> — 혼자 검토한 AI와 팀으로 검토한 AI 중 누가 더 많이 찾을까?<\/li><li>검토의견서 · 수정 기획안 · 예상 질의·답변까지 결재 대비 산출물 완성<\/li><\/ul><\/div><h4 style=\"margin-top:18px;\">🗂️ 프로젝트 폴더 구조<\/h4><div class=\"scenario-box\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;\">pre-review/<br>&nbsp;&nbsp;input/<br>&nbsp;&nbsp;&nbsp;&nbsp;기획안_청년회원_모바일웰컴패키지.md ← 다운로드 자료<br>&nbsp;&nbsp;&nbsp;&nbsp;참고_전년도_유사사업_결과.md &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 다운로드 자료<br>&nbsp;&nbsp;review-rules/ &nbsp;&nbsp;← 자동 생성<br>&nbsp;&nbsp;mailbox/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 자동 생성 (팀원 간 메시지 기록)<br>&nbsp;&nbsp;output/ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;← 자동 생성<\/span><\/div><h4 style=\"margin-top:18px;\">👥 팀 구성<\/h4><div class=\"team-viz\"><div class=\"team-lead\">👑 팀 리드 · 위원장 (Opus) — 쟁점만 골라 판정 · 결과 통합<\/div><div class=\"team-arrows\"><\/div><div class=\"team-members\"><div class=\"team-member\">💰 예산·성과<small>산출근거 · 성과지표<\/small><\/div><div class=\"team-member\">⚖️ 법무·개인정보<small>동의 · 위탁 · 법령<\/small><\/div><div class=\"team-member\">👥 회원 관점<small>청년 회원 니즈 · 채널<\/small><\/div><div class=\"team-member\">🔍 감사 시각<small>반대 신문 · 재지적 여부<\/small><\/div><\/div><div style=\"text-align:center;margin-top:10px;font-size:12px;color:var(--text-muted);\">(팀원은 모두 Sonnet · ↔ 팀원끼리 직접 메시지로 반박·보완)<\/div><\/div><div class=\"table-wrap\"><table class=\"kt\"><thead><tr><th>라운드<\/th><th>하는 일<\/th><th>포인트<\/th><\/tr><\/thead><tbody><tr><td class=\"hi\">1R<\/td><td>각자 자기 관점에서 검토<\/td><td>여기까지는 멀티 에이전트와 같음<\/td><\/tr><tr><td class=\"hi\">2R<\/td><td>팀원끼리 직접 메시지로 반박·보완<\/td><td><strong>팀만의 차이<\/strong> — 관점이 만나야 보이는 허점 발견<\/td><\/tr><tr><td class=\"hi\">3R<\/td><td>리드가 갈린 쟁점만 판정<\/td><td>결재권자 시각으로 정리<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout \"><strong>💡 적용 개념:<\/strong> 멀티 에이전트(실습 ③)는 서로 대화하지 않고, <strong>에이전트 팀은 팀원끼리 직접 대화합니다.<\/strong> 2라운드에서 무엇이 새로 나오는지 지켜보세요.<\/div><div class=\"callout warn\"><strong>⚠️ 참고용 검토:<\/strong> 법무·개인정보 팀원의 의견은 참고용입니다. 실제 기획안은 담당 부서·법무 검토를 거치세요.<\/div><\/div><div class=\"practice-section\"><h4>📥 실습 파일<\/h4><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"m2p4-zip\" onclick=\"downloadFile('m2p4-zip','실습4_사전검토위원회_자료.zip')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 실습4_사전검토위원회_자료.zip<\/span>\n  <span class=\"fdesc\">압축을 풀면 <span class=\"mono\">pre-review/<\/span> 폴더가 생깁니다. VS Code에서 이 폴더를 연 뒤 터미널에서 <span class=\"mono\">claude<\/span>를 실행하세요.<\/span>\n<\/div><div class=\"callout \"><strong>포함 파일:<\/strong> <span class=\"mono\">input/기획안_청년회원_모바일웰컴패키지.md<\/span> (허점 숨김) · <span class=\"mono\">input/참고_전년도_유사사업_결과.md<\/span> (감사 시각 팀원의 근거 자료)<\/div><\/div><div class=\"practice-section\"><h4>📋 팀 만들기 · 실행<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>베이스라인: 혼자 검토 <small>🎯 찾은 허점 개수를 메모<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 1 · 혼자 검토 (비교 기준)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-1\">input/기획안_청년회원_모바일웰컴패키지.md 를 결재 전에 검토해줘.\n문제점을 번호를 붙여 목록으로 정리해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>팀 생성 및 실행 <small>/clear 후 실행<\/small><\/span><\/div><div class=\"callout warn\"><strong>⚠️ 주의:<\/strong> Step 1 결과를 메모한 뒤 <span class=\"mono\">/clear<\/span>로 대화를 초기화하고 실행하세요. 앞의 검토 결과가 팀에 섞이지 않게 하기 위함입니다.<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 2 · 사전검토 위원회 팀 생성<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-2\">충돌되는 스킬은 이 작업에 적용하지 말고, 아래 지시대로만 진행해줘.\n\n결재 전 사전검토 위원회 에이전트 팀을 만들어줘.\n\n# 사전 준비 (팀 생성 전 먼저 실행)\nreview-rules/review-criteria.md 파일이 없으면 생성해줘.\n→ 공공기관 기획안 검토 기준 정의\n  (예산 산출근거 · 개인정보 수집·제공 동의 · 외부 위탁 관리 ·\n   정량 성과지표 · 추진 일정 현실성 · 전년도 유사사업 반영 여부)\n\n# 팀 구성\n- 팀 리드(위원장): 너 (Opus)\n- 팀원1 예산·성과: 산출근거, 단가·수량, 성과지표 (Sonnet)\n- 팀원2 법무·개인정보: 수집·이용 동의, 제3자 제공, 위탁 관리 (Sonnet)\n- 팀원3 회원 관점: 청년 회원 니즈, 선호 채널, 실제 체감 효과 (Sonnet)\n- 팀원4 감사 시각: 반대 신문 담당, 전년도 감사 권고 반영 여부 (Sonnet)\n\n# 검토 자료\n- input/기획안_청년회원_모바일웰컴패키지.md\n- input/참고_전년도_유사사업_결과.md\n\n# 진행 방식 (3라운드)\n1R 개별 검토: 각 팀원은 자기 관점에서 허점을 찾아 근거(기획안 위치)와 함께 정리\n2R 상호 반박·보완: 각 팀원은 다른 팀원의 의견을 읽고\n   최소 2명에게 직접 메시지를 보내 반박하거나 보완할 것\n   (예: &quot;그 문제는 전년도 자료와 연결하면 더 심각함&quot;, &quot;그건 허점이 아니라 의도된 설계로 보임&quot;)\n3R 리드 판정: 팀원 간 의견이 갈린 쟁점만 골라 최종 판정\n\n# 중요 규칙\n- 각 팀원은 작업 전 계획을 먼저 보고\n- 기획안에 없는 내용을 지어내지 말고 반드시 위치를 인용\n- 2R에서 오간 메시지는 mailbox/ 폴더에 기록\n\n# 최종 산출물\n- output/검토의견서.md : 허점 목록(심각도 높음/보통/낮음) + 쟁점 판정 결과\n- output/수정_기획안.md : 허점을 반영한 수정본\n- output/예상질의답변.md : 결재 과정에서 나올 질문 5개와 답변\n\n# CLAUDE.md 활용\n@review-rules/review-criteria.md<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>팀 토론 들여다보기 <small>mailbox/ 폴더도 직접 열어보기<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 3 · 2라운드 대화 확인<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-3')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-3\">2라운드에서 팀원들끼리 주고받은 메시지 중\n1라운드에는 없던 새로운 허점이 나온 대화를 보여줘.\n누가 누구에게 어떤 근거로 반박했는지 정리해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>허점 찾기 게임 결과 비교 <small>혼자 vs 팀<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">Step 4 · 혼자 검토 vs 팀 검토 비교<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-4')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-4\">Step 1에서 혼자 검토했을 때 찾은 허점과\n팀이 찾은 허점을 표로 비교해줘.\n(구분 | 혼자 검토 | 팀 검토 | 팀에서만 나온 이유)<\/div>\n<\/div><h4 style=\"margin-top:18px;\">💬 응용 질의<\/h4><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">이사회 대비 토론<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-q1')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-q1\">감사 시각 팀원의 역할을 &quot;이사회 이사&quot;로 바꿔서\n이 사업을 이사회에 올렸을 때 나올 반대 의견 3가지와\n담당자의 방어 논리를 팀원끼리 토론하게 해줘.<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">내 기획안으로 검토받기<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m2p4-q2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m2p4-q2\">사전검토 위원회 팀에게 내가 작성한 기획안을 검토하게 해.\n\n검토 대상: input/ 폴더에 넣은 내 기획안 파일\n(개인정보·비공개 내용은 지우고 넣을 것)\n\n진행 방식은 동일하게 1R 개별 검토 → 2R 상호 반박 → 3R 리드 판정.\n최종 산출물은 검토의견서와 예상 질의·답변 5개.<\/div>\n<\/div><div class=\"table-wrap\"><table class=\"kt\"><thead><tr><th>구분<\/th><th>혼자 검토 (Step 1)<\/th><th>팀 검토 (Step 2)<\/th><\/tr><\/thead><tbody><tr><td class=\"hi\">찾은 허점 수<\/td><td>___ 개<\/td><td>___ 개<\/td><\/tr><tr><td>팀에서만 나온 허점<\/td><td>—<\/td><td>___________<\/td><\/tr><tr><td class=\"hi\">핵심 포인트<\/td><td colspan=\"2\">서로 다른 관점이 <strong>직접 대화<\/strong>해야 보이는 허점이 있다 = <strong>에이전트 팀<\/strong><\/td><\/tr><\/tbody><\/table><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m2-ref\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">⌘<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M2 · Reference<\/span><h3>[참고] 슬래시 명령어 12개<\/h3><div class=\"practice-sub\">막힐 때, 길어질 때, 규칙을 바꿀 때 꺼내 쓰는 명령어<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\">\n  <div class=\"practice-section\"><div class=\"table-wrap\"><table class=\"kt\">\n    <thead><tr><th>명령어<\/th><th>하는 일<\/th><th>언제 쓰나<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td class=\"hi\">⭐ /init<\/td><td>프로젝트를 분석해 CLAUDE.md 자동 생성<\/td><td>제일 먼저 한 번<\/td><\/tr>\n      <tr><td class=\"hi\">⭐ /clear<\/td><td>대화 맥락 초기화<\/td><td>새 작업 시작할 때마다<\/td><\/tr>\n      <tr><td class=\"hi\">⭐ /compact<\/td><td>긴 대화를 요약·압축해 이어가기<\/td><td>대화가 길어져 느려질 때<\/td><\/tr>\n      <tr><td>/resume<\/td><td>이전 대화 불러와 이어서 작업<\/td><td>어제 하던 거 이어서<\/td><\/tr>\n      <tr><td>/model<\/td><td>모델 전환<\/td><td>어려운 작업엔 상위 모델로<\/td><\/tr>\n      <tr><td>/memory<\/td><td>CLAUDE.md를 바로 열어 수정<\/td><td>규칙 추가·수정할 때<\/td><\/tr>\n      <tr><td>/mcp<\/td><td>연결된 외부 도구 관리<\/td><td><\/td><\/tr>\n      <tr><td>/agents<\/td><td>서브에이전트 생성·관리<\/td><td><\/td><\/tr>\n      <tr><td>/review<\/td><td>작성된 코드 리뷰 요청<\/td><td>결과 점검할 때<\/td><\/tr>\n      <tr><td>/cost<\/td><td>현재 세션 사용량 확인<\/td><td>비용 궁금할 때<\/td><\/tr>\n      <tr><td>/hooks<\/td><td>자동 후처리 장치 설정<\/td><td><\/td><\/tr>\n      <tr><td>/help<\/td><td>전체 명령어 목록<\/td><td>막히면 일단 이것부터<\/td><\/tr>\n    <\/tbody><\/table><\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-plan\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">①<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · Hands-on<\/span><h3>서비스 기획의 중요성<\/h3><div class=\"practice-sub\">만들기 전에 “무엇을, 왜” 만들지부터 정리합니다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 진행 단계<\/h4><div class=\"scenario-box\"><ul><li><strong>아이디어 제네레이션<\/strong> — 핵심 질문 4가지(목표·대상·기능·디자인)로 생각을 정리하고, 메타 프롬프트로 아이디어를 받습니다.<\/li><li><strong>기획서 만들기<\/strong> — 초안 생성 → 역질문 받기 → 정리·저장 순서로 진행합니다.<\/li><li>결과는 <span class=\"mono\">plan.md<\/span>로 저장되어 이후 실습의 기준 문서가 됩니다.<\/li><\/ul><\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>아이디어 제네레이션 <small>만들고 싶은 AI 웹/앱에 대한 지시사항 프롬프트를 상세하게 설계합니다<\/small><\/span><\/div><div class=\"callout \"><strong>AI 웹/앱 제작을 위한 핵심 질문<\/strong><br><br>1. <strong>Goal (목표)<\/strong>: 이 앱은 무엇을 해결해주는 서비스인가요?<br>2. <strong>User (대상)<\/strong>: 누가, 언제 이 앱을 사용하나요?<br>3. <strong>Key Features (기능)<\/strong>: 반드시 포함되어야 할 핵심 기능 3가지는 무엇인가요?<br>4. <strong>Vibe (디자인)<\/strong>: 사용자가 느꼈으면 하는 감성이나 스타일은 무엇인가요?<\/div><div class=\"sub-step\"><span class=\"sn\">A<\/span><span>기획을 위한 메타 프롬프트 예시 <small>[ ] 안을 내 상황에 맞게 채우세요<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">① 업무용 웹/앱 아이디어 (메타 프롬프트)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-a\">당신은 전문 IT 서비스 기획자이자 UX/UI 설계 전문가입니다.\n바이브코딩으로 [웹사이트 / 업무용 앱 / AI 서비스 / 업무 자동화 도구]를 개발하려고 합니다.\n나는 평소 아래와 같은 업무를 반복적으로 합니다.\n[업무 1]\n[업무 2]\n반복되거나 번거로운 업무는 [구체적 상황 1~2개]입니다.\n\n위 내용을 토대로 업무 자동화를 위해 만들어 볼 수 있는 웹이 무엇이 있을지 아이데이션 하여\n바이브코딩 입문자가 반나절 안에 만들 수 있는 업무 도구 아이디어 5개를 제안해주세요.\n화면 구성, 사용자 이용 흐름, 데이터 입력·출력 방식과 필요한 기술을 설계해 주세요.\n직관적이고 세련된 UI/UX를 적용하고, 비개발자도 구현 가능한 MVP 범위를 제시해 주세요.\n프론트엔드만 구현할 예정입니다.<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">② 게임 아이디어 (메타 프롬프트)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-a2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-a2\">당신은 전문 게임 기획자이자 인터랙티브 콘텐츠 개발 전문가입니다.\n바이브코딩으로 [웹게임 / 모바일게임 / 퍼즐게임 / 시뮬레이션게임]을 제작하려고 합니다.\n나는 평소 [게임 유형]의 게임을 즐겨합니다.\n바이브코딩으로 만들어볼 게임의 유형 및 사용자 등에 대한 컨셉을 5가지 추천해주세요.\n게임의 핵심 재미 요소, 플레이 방식, 조작 방법 및 승리·실패 조건을 설계해 주세요.\n레벨 구성, 점수·보상 시스템, 난이도 조절 및 반복 플레이 요소를 제안해 주세요.\n게임 분위기에 맞는 그래픽 스타일, UI/UX, 애니메이션 및 사운드 방향을 제시해 주세요.\n프론트엔드만 구현할 예정입니다.<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">③ 최적의 제작 프롬프트 설계 (핵심 질문 답변 넣기)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-a3')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-a3\">전문적인 웹/앱을 제작하기 위한 최적의 프롬프트를 설계해줘.\n프롬프트 설계 시 아래의 정보를 반영해야 해.\nGoal (목표):\nUser (대상):\nKey Features (기능):\nVibe (디자인):<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>기획서 만들기<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">① 초안 생성<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-b\">아래 아이디어로 1장짜리 개발 기획서 초안을 작성해줘.\n항목: 서비스명 / 문제 / 사용자와 시나리오 / 핵심 기능 3개(우선순위) / 화면 구성 / 완성 기준\n\n[실습 ①에서 선정한 아이디어 + 문제 한 줄 붙여넣기]<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">② 역질문 받기<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-c\">이 기획서에서 빠졌거나 모호한 부분을 질문 5개로 만들어서 나에게 물어봐줘.\n내 답을 들은 뒤 기획서를 수정해줘.<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">③ 정리와 저장<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p1-d')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p1-d\">지금까지 논의를 모두 반영해 최종 기획서로 정리하고,\n이 폴더에 plan.md 파일로 저장해줘.<\/div>\n<\/div><div class=\"callout warn\"><strong>💎 핵심 인사이트:<\/strong> AI가 던지는 역질문에 답하는 과정에서 내 생각이 구체화됩니다. 기획이 선명할수록 결과물이 좋아집니다.<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-lunch\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">②<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · Hands-on<\/span><h3>점심 돌림판 만들기<\/h3><div class=\"practice-sub\">한 번에 다 시키지 않고 4단계로 쌓아 가며 완성합니다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 진행 흐름<\/h4><div class=\"step-row\"><div class=\"step\">1. 뼈대<\/div><div class=\"arrow\">→<\/div><div class=\"step\">2. 회전 연출<\/div><div class=\"arrow\">→<\/div><div class=\"step\">3. 메뉴 관리<\/div><div class=\"arrow\">→<\/div><div class=\"step hi\">4. 구글 지도 연결<\/div><\/div><div class=\"callout \"><strong>💡 바이브코딩의 리듬:<\/strong> “동작 먼저, 연출은 나중에” — 작게 만들고 확인하고 덧붙이는 것이 가장 빠릅니다. 결과는 <span class=\"mono\">lunch.html<\/span> 한 파일로 열어 확인하세요.<\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>돌림판 뼈대<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">메뉴 추첨기 (동작만)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p2-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p2-a\">lunch.html 파일 하나로 점심 메뉴 추첨기를 만들어줘.\n메뉴 목록: [내 메뉴 8개 붙여넣기]\n&quot;오늘 뭐 먹지?&quot; 버튼을 누르면 목록에서 무작위로 하나를 골라 크게 표시해줘.\n아직 돌림판 연출은 빼고, 동작만.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>회전 연출<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">원형 돌림판 + 3초 회전<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p2-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p2-b\">이제 연출을 입혀줘 → 메뉴 8개를 원형 돌림판으로 그리고,\n버튼을 누르면 3초간 빠르게 돌다가 천천히 멈추면서 당첨 칸을 가리키게 해줘.\n당첨 메뉴는 돌림판 아래에 크게 표시.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>메뉴 관리<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">메뉴 추가·삭제<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p2-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p2-c\">화면에서 메뉴를 추가·삭제할 수 있게 입력칸과 버튼을 만들어줘.\n메뉴가 바뀌면 돌림판도 즉시 다시 그려지게.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>구글 지도 연결<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">근처 맛집 보기 버튼<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p2-d')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p2-d\">당첨이 정해지면 &quot;근처 맛집 보기&quot; 버튼을 보여줘.\n누르면 구글 지도 검색이 새 탭으로 열리게 → 검색어는\n&quot;[기준점] + 당첨 메뉴 + 맛집&quot; 조합으로. 예: &quot;선릉역 김치찌개 맛집&quot;<\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-free\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">③<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · Hands-on<\/span><h3>자유 주제: 나만의 서비스 개발<\/h3><div class=\"practice-sub\">plan.md를 바탕으로 “최적의 제작 프롬프트”를 먼저 설계하고 만듭니다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 진행 단계<\/h4><div class=\"scenario-box\"><ul><li><span class=\"mono\">plan.md<\/span>를 바탕으로 제작 프롬프트를 설계합니다.<\/li><li>AI가 헷갈릴 부분을 <strong>역질문<\/strong>으로 확인하고 반영합니다.<\/li><li><strong>완성 기준 체크리스트<\/strong>와 <strong>하지 말아야 할 것<\/strong>을 더해 프롬프트를 완성합니다.<\/li><li>완성된 프롬프트로 서비스를 만들고, 필요하면 아래 링크에서 배포합니다.<\/li><\/ul><\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>프롬프트 설계<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">plan.md → 제작 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p3-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p3-a\">@plan.md 를 바탕으로 이 서비스를\n만들기 위한 최적의 프롬프트를 15줄 내외로 설계해줘.\n역할·작업·맥락·형식 구조로 써줘.\n기능, 디자인에 대해 자세히 작성해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>역질문으로 보완<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">모호한 부분 3개 질문받기<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p3-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p3-b\">이 프롬프트를 실행할 때 AI가 헷갈리거나\n멋대로 채울 부분 3개를 찾아 나에게 질문한 뒤, 답을 반영해 고쳐줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>완성 기준 추가<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">체크리스트 + 금지사항<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p3-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p3-c\">이 프롬프트에 완성 기준 체크리스트와\n하지 말아야 할 것을 추가해서 바이브 코딩용 서비스 제작 프롬프트를 완성해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>배포<\/span><\/div><a class=\"link-card\" href=\"https://www.netlify.com/\" target=\"_blank\" rel=\"noopener\"><span style=\"font-size:24px\">🚀<\/span><div><div class=\"lt\">Netlify<\/div><div class=\"ld\">netlify.com · 만든 html 파일을 올려 링크로 공유<\/div><\/div><\/a><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-skill\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">④<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · Hands-on<\/span><h3>주간업무보고서 자동생성 Skill 만들기<\/h3><div class=\"practice-sub\">메타 프롬프트로 시작해 스킬을 만들고, 실제 메모로 테스트합니다<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📁 실습 자료<\/h4><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"weekly-form\" onclick=\"downloadFile('weekly-form','주간보고_양식.docx')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 주간보고_양식.docx<\/span>\n  <span class=\"fdesc\">스킬이 따라야 할 주간보고 양식입니다. STEP 3에서 첨부합니다.<\/span>\n<\/div><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"weekly-memo\" onclick=\"downloadFile('weekly-memo','주간업무메모_테스트데이터.docx')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 주간업무메모_테스트데이터.docx<\/span>\n  <span class=\"fdesc\">STEP 4 테스트에 사용하는 업무 메모입니다.<\/span>\n<\/div><a class=\"link-card\" href=\"https://claude.ai/new\" target=\"_blank\" rel=\"noopener\"><span style=\"font-size:22px\">✨<\/span><div><div class=\"lt\">Claude 새 대화 열기<\/div><div class=\"ld\">claude.ai/new · 스킬 제작은 여기에서 진행<\/div><\/div><\/a><\/div><div class=\"practice-section\"><h4>📌 진행 흐름<\/h4><div class=\"step-row\"><div class=\"step\">STEP 1 · 메타 프롬프트<\/div><div class=\"arrow\">→<\/div><div class=\"step\">STEP 2 · Skill-creator<\/div><div class=\"arrow\">→<\/div><div class=\"step hi\">STEP 3 · 스킬 제작<\/div><div class=\"arrow\">→<\/div><div class=\"step\">STEP 4 · 설치·테스트<\/div><\/div><\/div><div class=\"practice-section\"><h4>📋 프롬프트<\/h4><div class=\"sub-step\"><span class=\"sn\">1<\/span><span>스킬 제작용 프롬프트 생성하기 <small>메타 프롬프트 · [기업명]은 대한지방행정공제회로 채우세요<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">메타 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p4-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p4-a\">[기업명] 주간업무보고서 작성 도우미를 만들고 싶어.\n팀원이 작성한 업무 메모를 읽고 첨부한 양식에 맞춰서 주간보고 초안을 작성해주는 플러그인이야.\n만들기 전에 필요한 내용을 나한테 먼저 질문해줬으면 좋겠어.\n해당 플러그인을 생성할 수 있는 프롬프트를 10~15줄 내외로 코드블럭 내에 작성해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">2<\/span><span>Skill-Creator 불러오기<\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">스킬 제작 도구 호출<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p4-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p4-b\">/Skill-creator<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">3<\/span><span>프롬프트 작성을 통한 플러그인 제작하기 <small>주간보고_양식.docx를 함께 첨부<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">스킬 제작 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p4-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p4-c\">/skill-creator\n\n이름: 주간보고 도우미\n\n### 하는 일\n팀원이 붙여넣은 업무 메모를 읽고, 첨부한 양식에 맞춰\n주간보고 초안을 만든다\n\n### 포함할 것\n- 참조 파일: 주간보고_양식.docx (첨부)\n\n### 규칙\n- 수치는 메모에 있는 것만 사용, 없으면 [확인 필요]\n- 이슈는 원인 → 영향 → 대응 → 요청사항 순서\n\n### 진행 방식\n만들기 전에 필요한 내용이 있다면 최대 3가지의 질문을 먼저 해줘<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">4<\/span><span>설치하고 테스트 하기 <small>주간업무메모_테스트데이터.docx를 함께 첨부<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">스킬 호출 테스트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3p4-d')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3p4-d\">@주간보고 도우미\n첨부한 메모를 활용해서 이번 주 주간보고 만들어줘<\/div>\n<\/div><div class=\"callout warn\"><strong>💎 핵심 인사이트:<\/strong> 스킬은 “나의 작업 방식”을 AI에게 한 번 가르쳐 두는 일입니다. 다음부터는 메모만 던지면 양식에 맞춘 초안이 나옵니다.<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-sheet\">\n\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">⑤<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · 자유 실습 · 적용 개념: Agent / Skill / 업무 기획<\/span><h3>나만의 Agent · Skill 기획 시트<\/h3><div class=\"practice-sub\">내 업무를 7단계로 채우면 Claude Code · Claude에 바로 넣을 제작 프롬프트가 완성됩니다<\/div><\/div>\n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 시작 전에<\/h4>\n  <div class=\"scenario-box\"><strong>진행 방법<\/strong><ul>\n    <li>내 업무 중 <strong>반복 작업 하나<\/strong>를 정하고, Agent와 Skill 중 맞는 쪽의 시트를 고릅니다.<\/li>\n    <li>단계별로 채우면 아래 프롬프트 창에 <strong>여기까지 완성된 제작 프롬프트<\/strong>가 바로 반영됩니다.<\/li>\n    <li>막히면 <strong>예시 채우기<\/strong>로 작성법을 본 뒤, 각 단계로 돌아가 내 업무에 맞게 고쳐 쓰세요.<\/li>\n    <li>입력 내용은 이 화면을 열어 둔 동안만 유지됩니다. 마치기 전에 <strong>TXT로 저장<\/strong>하세요.<\/li>\n  <\/ul><\/div>\n  <div class=\"table-wrap\"><table class=\"kt\"><thead><tr><th>구분<\/th><th>🧩 Skill<\/th><th>🤖 Agent<\/th><\/tr><\/thead><tbody>\n    <tr><td class=\"hi\">한 줄 정의<\/td><td>나의 작업 방식(양식·규칙)을 한 번 가르쳐 두기<\/td><td>여러 단계를 스스로 수행하는 업무 담당자 만들기<\/td><\/tr>\n    <tr><td>이럴 때<\/td><td>매번 같은 양식·문체·기준을 다시 설명할 때<\/td><td>파일을 읽고·나누고·검산하는 등 단계와 역할이 여러 개일 때<\/td><\/tr>\n    <tr><td>예시<\/td><td>주간보고 도우미 (M3 ④)<\/td><td>주간보고 파이프라인 (M2 ②) · 사전검토 위원회 (M2 ④)<\/td><\/tr>\n    <tr><td class=\"hi\">만드는 곳<\/td><td>Claude · <span class=\"mono\">/skill-creator<\/span><\/td><td>Claude Code · CLAUDE.md + 에이전트 파일<\/td><\/tr>\n  <\/tbody><\/table><\/div>\n  <div class=\"callout warn\"><strong>⚠️ 가상 자료 원칙:<\/strong> 실제 회원정보·개인정보·비공개 내부 자료는 입력하지 마세요. 테스트는 가상 자료로만 진행합니다.<\/div>\n  <div class=\"sheet-jump\"><a href=\"#sheet-agent\" onclick=\"return jumpSheet('agent')\">🤖 Agent 기획 시트로 ↓<\/a><a href=\"#sheet-skill\" onclick=\"return jumpSheet('skill')\">🧩 Skill 기획 시트로 ↓<\/a><\/div>\n  <\/div>\n  <div class=\"practice-section\"><div class=\"plan-sheet\" id=\"sheet-agent\" data-sheet=\"agent\"><\/div><\/div>\n  <div class=\"practice-section\"><div class=\"plan-sheet\" id=\"sheet-skill\" data-sheet=\"skill\"><\/div><\/div>\n  <\/div>\n<\/div>\n<\/div>\n<div class=\"panel\" data-panel=\"m3-ref\">\n<div class=\"practice\">\n  <div class=\"practice-head\">\n    <div class=\"practice-num\">⌘<\/div>\n    <div class=\"practice-meta\"><span class=\"practice-tag\">M3 · Reference<\/span><h3>[참고] 스킬 제작 프롬프트 모음<\/h3><div class=\"practice-sub\">보고서·문안 검토·Red Team·PPT, 4가지 업무용 스킬<\/div><\/div>\n    \n  <\/div>\n  <div class=\"practice-body single\"><div class=\"practice-section\"><h4>📌 이렇게 쓰세요<\/h4><div class=\"scenario-box\"><ul><li>각 프롬프트를 Claude에 입력해 <strong>스킬을 먼저 만들고<\/strong>, 이후 업무에서 호출해 사용합니다.<\/li><li>제작 프롬프트를 내 업무에 맞게 고쳐 쓰면 나만의 스킬이 됩니다.<\/li><\/ul><\/div><\/div><div class=\"practice-section\"><h4>📋 스킬 4종<\/h4><div class=\"sub-step\"><span class=\"sn\">A<\/span><span>보고서 리서치 및 작성 Skill <small>주제 한 줄만 입력해도 완성도 높은 보고서 작성<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">보고서 작성 스킬 제작 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3ref-a')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3ref-a\">내가 보고서 주제만 짧게 입력해도, 알아서 완성도 높은 비즈니스 보고서를 작성해주는 Skill을 만들고 싶어.\n\n예를 들어 내가 다음과 같이만 요청할 수 있어.\n\n“AI와 사람의 협업 방식과 업무 재설계에 대한 보고서 써줘.”\n\n이처럼 요청이 짧고 다소 모호하더라도 Skill이 알아서 다음을 수행해야 해.\n\n* 요청의 목적과 예상 독자 파악\n* 보고서에서 다뤄야 할 핵심 질문 설정\n* 필요한 자료 조사 및 신뢰도 확인\n* 주요 주장과 근거 연결\n* 주제에 적합한 보고서 구조 설계\n* 현황, 주요 개념, 사례, 분석, 시사점, 실행 제안 작성\n* 사실, 해석, 제안을 구분\n* 출처가 불명확한 내용을 임의로 작성하지 않음\n* 논리, 근거, 중복, 누락을 최종 검수\n* 일반적인 비즈니스 보고서 형식으로 깔끔하게 출력\n\n사용자에게 복잡한 입력 양식을 요구하지 않게 해줘.\n\n보고서 작성에 반드시 필요한 정보가 없을 때만 최대 2개의 짧은 질문을 하고, 그 외에는 일반적인 비즈니스 상황을 기준으로 합리적으로 판단해서 진행하게 해줘. 단, 추론한 내용은 확인된 사실처럼 표현하지 않게 해줘.\n\nSkill의 복잡한 작업 지침은 사용자가 아니라 Skill 내부에 들어가야 해. 사용자는 대부분 보고서 주제나 간단한 요청만 입력하도록 설계해줘.\n\n이 요구사항을 바탕으로 실제 Skill을 만들 때 사용할 제작 프롬프트를 작성해줘. 설명은 제외하고, 바로 사용할 수 있는 Skill 제작 프롬프트만 출력해줘.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">B<\/span><span>제안서·고객 문안 검토 Skill <small>발송 전 리스크 점검 · 스킬명 business-message-review<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">고객 문안 사전 검토 스킬<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3ref-b')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3ref-b\"># 고객 문안 사전 검토 스킬\n\n## 목적\n고객·외부 이해관계자에게 발송하거나 제출하기 전에 이미 작성된 문안을 검토한다.\n제안서, 견적 안내, 이메일, 프로모션, 계약·갱신 안내 등에 사용한다.\n초안 작성에는 사용하지 않고, 사용자가 기존 문안의 검토·점검을 요청할 때만 작동한다.\n\n## 검토 절차\n\n### 1. 리스크 스캔\n아래 5개 유형을 빠짐없이 점검한다.\n1. 확정 약속: 보장, 반드시, 무조건 등\n2. 과장 표현: 최고, 완벽, 유일 등 근거 없는 단정\n3. 오안내 위험: 가격, 계약, 위약금, 일정, 제공 조건 등의 오해 가능성\n4. 비공식 조건: 확인·승인되지 않은 혜택, 할인, 일정 등의 암시\n5. 개인정보·기밀: 개인정보, 타 고객 정보, 사내 기밀 노출\n\n다음 형식으로 작성한다.\n\n| 위험 표현(원문) | 유형 | 위험 이유 | 수정안 |\n|---|---|---|---|\n\n위험이 없는 유형도 반드시 &quot;이상 없음&quot;으로 표시한다.\n\n### 2. 근거 점검\n문안의 수치·가격·조건·일정을 확인한다.\n근거를 확인할 수 없으면 임의 수정하지 말고 &quot;내부 확인 필요&quot;로 표시한다.\n첨부 자료가 있다면 문안과 불일치하는 내용도 지적한다.\n\n### 3. 고객 관점 점검\n고객이 질문하거나 반박할 가능성이 높은 포인트 3가지와 각각의 보완 방법을 제시한다.\n\n### 4. 수정본\n위험 표현과 불명확한 문장을 개선한 전체 수정본을 제공한다.\n원문의 사실·조건·혜택·수치는 임의로 변경하거나 새로 만들지 않는다.\n주요 변경 이유를 3줄 이내로 요약한다.\n\n### 5. 최종 판정\n다음 중 하나로 판정하고 이유를 1문장으로 설명한다.\n- 발송 가능\n- 수정 후 발송\n- 내부 확인 필요\n\n## 절대 규칙\n- 새로운 사실·혜택·조건·수치를 창작하지 않는다.\n- 모르는 정책이나 조건은 추측하지 않고 &quot;내부 확인 필요&quot;로 표시한다.\n- 5개 리스크 유형을 모두 점검한다.\n- 문제 문장은 반드시 원문을 인용해 구체적으로 지적한다.\n- 최종 수정본은 사용자가 바로 복사해 사용할 수 있도록 완성된 형태로 제공한다.\n\n## 스킬명\nbusiness-message-review<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">C<\/span><span>Red Team Skill <small>보고서의 허점·근거 부족·예상 반박을 점검<\/small><\/span><\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">report-redteam-screening 제작 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3ref-c')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3ref-c\">아래의 지시사항을 그대로 수행하는 Skills를 만들어줘.\n\n## 기본 정보\n- Skill 이름: report-redteam-screening\n- 한 줄 목적: 사용자가 보고서 파일(.docx/.pdf/.md/.txt) 또는 채팅에 붙여넣은 텍스트를 업로드하면, Red-Team(공격자/비판자) 관점에서 논리적 허점·근거 부족·리스크 요소를 스크리닝해서 구조화된 피드백을 제공한다.\n\n## 트리거 조건\n다음과 같은 요청에서 반드시 사용:\n- &quot;이 보고서 레드팀 관점에서 검토해줘&quot;\n- &quot;이 문서 허점 찾아줘&quot;\n- &quot;발표 전에 취약점 점검해줘&quot;\n- &quot;이 초안 비판적으로 리뷰해줘&quot;\n- 사용자가 보고서/제안서/기획안 파일을 업로드하고 &quot;문제점&quot;, &quot;리스크&quot;, &quot;반박 포인트&quot;, &quot;약점&quot;을 물어보는 경우\n\n## 워크플로우\n1단계 — 역질문(스코프 확인):\n   보고서 유형(내부 기획안/외부 제안서/경영진 보고/학술형 등), 스크리닝 관점(전략적 허점 / 데이터·근거 신뢰성 / 실행 리스크 / 법무·컴플라이언스 / 경쟁사·이해관계자 반박 포인트 중 우선순위), 톤(건설적 피드백 vs 냉정한 공격적 검토) 확인. 사용자가 이미 명시했다면 생략 가능.\n\n2단계 — 스크리닝 기준 개요 승인:\n   확정된 기준(예: 논리 비약, 검증 안 된 가정, 데이터 출처 불명, 반대 이해관계자 관점 누락, 실행 가능성 리스크, 최악의 시나리오 대응 부재 등)을 목록으로 제시하고 사용자 승인 받기. 승인 전에는 최종 리포트 생성하지 않음.\n\n3단계 — 최종 스크리닝 리포트 생성:\n   승인된 기준에 따라 문단/섹션별로 정밀 스크리닝 수행 후, 아래 출력 포맷으로 결과 제공.\n\n## 출력 포맷\n- 이슈별로: [심각도: 상/중/하] / [해당 위치·인용] / [문제점 설명] / [예상 반박·공격 시나리오] / [보완 제안]\n- 전체 요약 섹션(Executive Summary)을 최상단에 배치\n- 한국어, Pretendard 폰트 기준 문서라면 14pt 이상 유지 (HTML/PPT로 출력 시)\n- 결과물은 대화 내 텍스트가 기본이며, 사용자가 파일(Word/HTML)로 요청 시에만 파일 생성\n\n## 엣지 케이스\n- 보고서가 너무 짧거나(1페이지 미만) 근거 자료가 없는 경우 → 스크리닝 범위를 명시하고 진행\n- 첨부파일이 없고 아이디어만 구두로 설명된 경우 → 텍스트 그대로 받아 스크리닝 가능함을 안내\n- 여러 파일이 동시 업로드된 경우 → 파일별로 구분해서 스크리닝<\/div>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">테스트용 보고서 (붙여넣어 시험)<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3ref-c2')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3ref-c2\">[영업기획 보고서]\n\n제목: 2026년 하반기 수원·화성권역 SME 대상 인터넷+CCTV 결합상품 확대 방안\n작성자: 김O현 (기업영업팀, 세일즈 매니저)\n작성일: 2026년 8월 20일\n수신: 기업영업팀장\n\n1. 배경\n최근 수원·화성 산업단지 내 중소 제조업체를 대상으로 진행한 영업 미팅에서\n&quot;인터넷 + CCTV 보안&quot; 결합상품에 대한 문의가 다수 발생함. 담당 권역 3개 업체와의\n미팅에서 3곳 모두 긍정적인 반응을 보임에 따라, 해당 결합상품을 권역 내 전체\n중소사업장으로 확대 제안하고자 함.\n\n2. 시장 기회\n- 산업단지 내 제조업체는 총 약 1,200개사로 추정되며, 이 중 상당수가 노후 CCTV를\n  사용 중일 것으로 판단됨.\n- 경쟁사 대비 결합 할인율이 높기 때문에 시장 점유율 확대가 가능할 것으로 예상됨.\n- SNS상에서 &quot;중소기업 보안 강화 필요성&quot;에 대한 언급이 증가하는 추세이므로,\n  수요는 앞으로 더 커질 것으로 판단됨.\n\n3. 제안 내용\n- 8월 말까지 결합상품 프로모션(3개월 CCTV 설치비 무료)을 진행.\n- 기업영업팀 인력을 투입해 산업단지 내 전 사업장 방문 영업 실시.\n- 목표: 4분기까지 결합상품 가입 300건 달성.\n\n4. 기대 효과\n결합상품을 통해 고객 이탈률이 낮아지고, 매출도 동반 상승할 것으로 기대됨.\n또한 CCTV 결합을 통해 고객 lock-in 효과가 발생하여 장기적으로 안정적인\n매출 기반을 확보할 수 있을 것으로 판단됨.\n\n5. 결론\n본 제안은 시장 반응이 검증된 전략이며, 특별한 리스크 없이 빠르게 실행 가능한\n과제로 판단되어 조속한 승인을 요청드립니다.<\/div>\n<\/div><div class=\"sub-step\"><span class=\"sn\">D<\/span><span>PPT 생성 스킬 제작하기 <small>템플릿이 존재하는 경우 · 디자인 시스템 PPT + Skill<\/small><\/span><\/div><div class=\"file-card\">\n  <button class=\"file-btn pending\" data-file=\"ppt-template\" onclick=\"downloadFile('ppt-template','PPT_Template_기획팀_(2).pptx')\">⬇ 다운로드<\/button>\n  <span class=\"fname\">📎 PPT_Template_기획팀_(2).pptx<\/span>\n  <span class=\"fdesc\">기준 디자인이 담긴 PPT 템플릿입니다. 아래 프롬프트와 함께 Claude에 첨부하세요.<\/span>\n<\/div><div class=\"prompt-block\">\n  <div class=\"pb-head\"><span class=\"pb-name\">디자인 시스템 PPT·Skill 제작 프롬프트<\/span><button class=\"copy-btn\" onclick=\"copyPrompt(this,'m3ref-d')\">📋 복사<\/button><\/div>\n  <div class=\"pb-content\" id=\"pb-m3ref-d\">@skill-creator \nPPT에서 확인 가능한 디자인을 분석하여 표로 정리해 주세요. \n1. 컬러 팔레트 (배경색, 텍스트색, 포인트 컬러 — 정확한 HEX 코드로) \n2. 타이포그래피 (폰트 종류, 제목/본문/캡션별 크기와 굵기) \n3. 레이아웃 규칙 (여백, 정렬, 그리드) \n4. 슬라이드 유형별 구성 (커버, 목차, 본문, 데이터, 마무리) \n\n분석한 내용을 바탕으로 내가 앞으로 계속 쓸 &#x27;디자인 시스템 PPT 파일&#x27;과 디자인 시스템 Skill을 만들어 주세요. \n\n포함할 것: \n- 컬러/폰트/레이아웃 규칙 정리 슬라이드 \n- 슬라이드 유형별 템플릿 (커버, 목차, 본문 텍스트형, 본문 이미지형, 데이터/차트, 인용, 마무리) \n\n단, 원본 디자인 가이드 PPT에 명시된 규칙에 어긋나지 않도록 주의해 주세요.\n이 파일 및 스킬은 앞으로 대한지방행정공제회에서 PPT 만들 때(이사회·운영위원회 보고, 회원 안내·설명회 자료, 사업 추진 보고 등)마다 참고할 기준 문서입니다.<\/div>\n<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<\/div>";

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function downloadFile(key, filename) {
  const b64data = FILES[key];
  if (!b64data) { showToast('📎 "' + filename + '" 파일이 아직 연결되지 않았습니다. 강사에게 문의하세요.'); return; }
  try {
    const CHUNK = 32768;
    const b64 = b64data.replace(/[^A-Za-z0-9+/]/g, '');
    const bytes = new Uint8Array(Math.floor(b64.length * 3 / 4));
    let idx = 0;
    for (let i = 0; i < b64.length; i += CHUNK) {
      const chunk = b64.slice(i, i + CHUNK);
      const bin = atob(chunk.padEnd(Math.ceil(chunk.length / 4) * 4, '='));
      for (let j = 0; j < bin.length; j++) bytes[idx++] = bin.charCodeAt(j);
    }
    const mime = filename.endsWith('.docx') ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : filename.endsWith('.pptx') ? 'application/vnd.openxmlformats-officedocument.presentationml.presentation' : 'application/zip';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes.subarray(0, idx)], {type: mime}));
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) { showToast('다운로드 오류: ' + e.message); }
}

function copyPrompt(btn, id) {
  const txt = document.getElementById('pb-' + id).innerText;
  const done = () => {
    const orig = btn.innerHTML;
    btn.classList.add('copied'); btn.innerHTML = '✓ 복사됨';
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  }
}

(function init() {
  document.getElementById('main').innerHTML = PANELS_HTML;
  // 파일이 연결된 버튼은 활성 색상으로
  document.querySelectorAll('[data-file]').forEach(b => { if (FILES[b.dataset.file]) b.classList.remove('pending'); });
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.dataset.tab;
      navItems.forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const target = document.querySelector('.panel[data-panel="' + tab + '"]');
      if (target) { target.classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      const m = TAB_META[tab];
      if (m) {
        document.querySelector('[data-crumb]').textContent = m.crumb;
        document.querySelector('[data-title]').textContent = m.title;
        document.querySelector('[data-lead]').textContent = m.lead;
      }
      document.getElementById('sidebar').classList.remove('open');
    });
  });
})();

/* font size controller */
(function() {
  const KEY = 'poba_font_scale', MIN = 80, MAX = 150, STEP = 10, DEF = 100;
  const minus = document.getElementById('fsMinus'), plus = document.getElementById('fsPlus');
  const reset = document.getElementById('fsReset'), label = document.getElementById('fsLabel');
  let scale = DEF;
  try { const s = parseInt(localStorage.getItem(KEY), 10); if (!isNaN(s) && s >= MIN && s <= MAX) scale = s; } catch (e) {}
  const styleEl = document.createElement('style'); document.head.appendChild(styleEl);
  function apply() {
    styleEl.textContent = '.app { zoom: ' + (scale / 100) + '; } .font-size-controller { zoom: 1 !important; }';
    label.textContent = scale + '%';
    minus.disabled = scale <= MIN; plus.disabled = scale >= MAX;
    try { localStorage.setItem(KEY, String(scale)); } catch (e) {}
  }
  minus.addEventListener('click', () => { scale = Math.max(MIN, scale - STEP); apply(); });
  plus.addEventListener('click', () => { scale = Math.min(MAX, scale + STEP); apply(); });
  reset.addEventListener('click', () => { scale = DEF; apply(); });
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); plus.click(); }
    else if (e.key === '-') { e.preventDefault(); minus.click(); }
    else if (e.key === '0') { e.preventDefault(); reset.click(); }
  });
  apply();
})();
</script>

        format: '1. 출장 개요(목적 · 기간 · 장소 · 출장자) / 2. 주요 내용(주제별 개조식) / 3. 시사점 / 4. 후속 조치 표(조치 · 담당 · 기한) / 붙임 자료 목록',
        style: '명사형 개조식 종결("~ 확인", "~ 필요"), 항목당 2줄 이내, 기관명은 정식 명칭으로 표기',
        rules: '메모에 있는 내용만 사용한다. 면담자는 실명 대신 소속 · 직위로 적는다. 사실과 의견을 구분해 의견에는 "(의견)"을 붙인다.',
        dont: '메모에 없는 성과 · 수치 · 합의 사항을 만들지 않는다. 후속 조치 담당 · 기한을 추정하지 않는다(없으면 미정).',
        tests: '기간 없는 메모 → 기간 질문 1개\n의견만 있는 메모 → 시사점에 (의견) 표시\n후속 조치에 담당 없음 → 미정으로 표시',
        done: '메모 붙여넣기 한 번으로 양식 4단 구조의 보고서가 나오고, 사실 · 의견 · 확인 필요 사항이 구분되어 있다.' }}
    }
  }
};

function jumpSheet(k) {
  const el = document.getElementById('sheet-' + k);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return false;
}

function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildPlanSheet(root) {
  const key = root.dataset.sheet, S = PLAN_SHEETS[key], N = S.steps.length;
  let step = 0;
  let h = '<span class="sheet-badge">' + S.badge + '</span><div class="sheet-title">' + S.title + '</div><div class="sheet-desc">' + S.desc + '</div>';
  h += '<div class="callout"><strong>💡 예시로 작성법 살펴보기</strong> — 누르면 모든 칸이 예시로 채워지고 전체 프롬프트가 완성됩니다. 각 단계로 돌아가 내 업무에 맞게 고쳐 쓰세요.<div class="plan-examples">';
  for (const [ek, ex] of Object.entries(S.examples)) h += '<button type="button" class="plan-btn" data-ex="' + ek + '">' + ex.label + ' 채우기</button>';
  h += '<button type="button" class="plan-btn ghost" data-clear>전체 지우기</button></div><div class="plan-status" aria-live="polite"></div></div>';
  h += '<div class="plan-tabs" role="tablist">' + S.steps.map((s, i) => '<button type="button" data-step="' + i + '">' + s.t + '</button>').join('') + '</div>';
  h += '<form class="plan-form" onsubmit="return false">';
  S.steps.forEach((s, i) => {
    h += '<fieldset data-panel-step="' + i + '"><legend>' + s.t + '</legend><div class="lg-hint">' + s.hint + '</div>';
    s.f.forEach(([id, label, ph]) => {
      const fid = 'plan-' + key + '-' + id;
      h += '<label for="' + fid + '">' + label + '</label><textarea id="' + fid + '" data-key="' + id + '" data-label="' + escH(label) + '" rows="3" placeholder="' + escH(ph) + '"></textarea>';
    });
    h += '</fieldset>';
  });
  h += '</form>';
  h += '<div class="plan-nav"><div class="grp"><button type="button" class="plan-btn" data-prev>← 이전 단계</button><button type="button" class="plan-btn primary" data-next>다음 단계 →</button></div><span class="plan-progress"></span></div>';
  const pid = 'plan-' + key + '-preview';
  h += '<div class="prompt-block"><div class="pb-head"><span class="pb-name" data-ptitle>단계별 프롬프트</span><button class="copy-btn" onclick="copyPrompt(this,\'' + pid + '\')">📋 복사</button></div><div class="pb-content" id="pb-' + pid + '"></div></div>';
  h += '<div class="plan-nav"><div class="grp"><button type="button" class="plan-btn primary" data-save>⬇ 전체 기획 TXT 저장</button></div></div>';
  h += '<div class="callout success"><strong>✅ 완성 기준</strong> — 업무 · 입력 · 절차 · 결과물 · 규칙 · 테스트가 모두 구체적이고, 가상 자료로 바로 시험해 볼 수 있습니다.</div>';
  root.innerHTML = h;

  const panels = [...root.querySelectorAll('[data-panel-step]')];
  const tabs = [...root.querySelectorAll('[data-step]')];
  const areas = [...root.querySelectorAll('textarea')];
  const pre = root.querySelector('#pb-' + pid);

  function text(last) {
    const secs = panels.slice(0, last + 1).map(p => '[' + p.querySelector('legend').textContent + ']\n' +
      [...p.querySelectorAll('textarea')].map(a => a.dataset.label + '\n' + (a.value.trim() || '[작성 필요]')).join('\n\n'));
    return S.intro + '\n\n' + secs.join('\n\n');
  }
  function render() {
    panels.forEach((p, i) => p.hidden = i !== step);
    tabs.forEach((b, i) => {
      if (i === step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      b.classList.toggle('done', [...panels[i].querySelectorAll('textarea')].every(a => a.value.trim()));
    });
    root.querySelector('[data-ptitle]').textContent = step === N - 1 ? '전체 기획 프롬프트' : '여기까지 완성한 프롬프트 · ' + (step + 1) + '단계';
    pre.textContent = text(step);
    root.querySelector('[data-prev]').disabled = step === 0;
    root.querySelector('[data-next]').disabled = step === N - 1;
    const filled = areas.filter(a => a.value.trim()).length;
    root.querySelector('.plan-progress').textContent = '작성 ' + filled + ' / ' + areas.length + '칸';
  }
  tabs.forEach((b, i) => b.onclick = () => { step = i; render(); });
  root.querySelector('[data-prev]').onclick = () => { step = Math.max(0, step - 1); render(); };
  root.querySelector('[data-next]').onclick = () => { step = Math.min(N - 1, step + 1); render(); };
  root.querySelector('form').oninput = render;
  root.querySelector('[data-save]').onclick = () => {
    const url = URL.createObjectURL(new Blob([text(N - 1)], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = S.file;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const status = root.querySelector('.plan-status');
  root.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
    const ex = S.examples[b.dataset.ex];
    areas.forEach(a => { a.value = ex.v[a.dataset.key] || ''; });
    step = N - 1; render();
    status.textContent = ex.label + '를 모든 칸에 채웠습니다. 아래 전체 프롬프트를 확인하세요.';
  });
  root.querySelector('[data-clear]').onclick = () => {
    if (areas.some(a => a.value.trim()) && !confirm('작성한 내용을 모두 지울까요?')) return;
    areas.forEach(a => a.value = ''); step = 0; render(); status.textContent = '모든 칸을 비웠습니다.';
  };
  render();
}
document.querySelectorAll('.plan-sheet[data-sheet]').forEach(buildPlanSheet);
</script>
</body>
</html>
